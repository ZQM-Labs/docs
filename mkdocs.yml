site_name: ZQM Labs Docs
site_description: ZQM Labs documentation hub — how to play, the host handbook for Wisp's Lost Lanterns, and the front door to every ZQM Labs doc site.
site_author: ZQM Labs
site_url: https://docs.zqmlabs.com/
repo_url: https://github.com/ZQM-Labs/docs

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - How to Play: how-to-play.md
  - Host Handbook:
      - Hosting a Game: hosting/index.md
      - Choosing a Tier: hosting/tiers.md
      - Before the Event: hosting/before-the-event.md
      - Running the Event: hosting/running-the-event.md
      - Day-Of Troubleshooting: hosting/troubleshooting.md
      - Safety & Supervision: hosting/safety.md
      - After the Event: hosting/after-the-event.md
  - FAQ: faq.md
  - All Doc Sites: doc-sites.md
  - Contact: contact.md

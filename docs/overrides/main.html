{% extends "base.html" %}
{% block extrahead %}
{% set page_title = (page.title ~ " · " ~ config.site_name) if page and page.title else config.site_name %}
{% set page_description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.canonical_url }}">
<meta property="og:image" content="https://zqmlabs.com/img/social-card-evergreen.webp">
<meta property="og:image:alt" content="ZQM Labs — Z's Quests & Mischief">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="https://zqmlabs.com/img/social-card-evergreen.webp">
{% endblock %}

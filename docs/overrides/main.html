{% extends "base.html" %}
{% block extrahead %}
<meta property="og:title" content="{% if page and page.title %}{{ page.title }} · {% endif %}{{ config.site_name }}">
{% set page_description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
<meta property="og:description" content="{{ page_description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.canonical_url }}">
<meta property="og:image" content="https://zqmlabs.com/img/logo-primary-evergreen.webp">
<meta property="og:image:alt" content="ZQM Labs — Z's Quests & Mischief">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page and page.title %}{{ page.title }} · {% endif %}{{ config.site_name }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="https://zqmlabs.com/img/logo-primary-evergreen.webp">
<meta name="twitter:image:alt" content="ZQM Labs — Z's Quests & Mischief">
{% endblock %}
